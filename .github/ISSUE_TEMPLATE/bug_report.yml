name: Bug report
description: Report reproducible incorrect behavior
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Polysocial version
      placeholder: v0.1.0
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Python version, installation type, and browser. Remove all tokens and secrets.
